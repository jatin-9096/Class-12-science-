name: 24x7 Autonomous Builder

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: site-builder
  cancel-in-progress: false

jobs:
  run-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install groq beautifulsoup4

      - name: Run builder
        id: builder
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python smart_agent.py

      - name: Commit and push
        if: always()
        run: |
          git config user.name "Shorveer-Bot"
          git config user.email "bot@shorveernotes.local"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto: builder update [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Chain next run (10 minute gap)
        if: steps.builder.outputs.has_more == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          sleep 600
          gh workflow run "24x7 Autonomous Builder" --ref main
