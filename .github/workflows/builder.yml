name: 24x7 Autonomous Builder

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      subject:
        description: "Subject (mathematics, physics, chemistry, english)"
        required: false
        default: ""
      chapter:
        description: "Chapter number (e.g., 1, 2)"
        required: false
        default: ""
      limit:
        description: "Chapters per run"
        required: false
        default: "1"
      force:
        description: "Force overwrite? (true/false)"
        required: false
        default: "false"

permissions:
  contents: write
  actions: write

concurrency:
  group: site-builder
  cancel-in-progress: false

jobs:
  run-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install groq beautifulsoup4

      - name: Run builder
        id: builder
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          CMD="python builder.py --limit ${{ github.event.inputs.limit || '1' }}"
          if [ -n "${{ github.event.inputs.subject }}" ]; then
            CMD="$CMD --subject ${{ github.event.inputs.subject }}"
          fi
          if [ -n "${{ github.event.inputs.chapter }}" ]; then
            CMD="$CMD --chapter ${{ github.event.inputs.chapter }}"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            CMD="$CMD --force"
          fi
          $CMD

      - name: Commit and push
        if: always()
        run: |
          git config user.name "Shorveer-Bot"
          git config user.email "bot@shorveernotes.local"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto: builder update [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Chain next run
        if: always() && github.event.inputs.force != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          PENDING=$(python -c "
          import builder
          targets = builder.analyze_website()
          state = builder.load_state()
          left = [t for t in targets if state.get(f\"{t['subject']}::ch{t['chapter_num']}::{t['path']}\", {}).get('status') != 'done']
          print('true' if left else 'false')
          ")
          if [ "$PENDING" = "true" ]; then
            sleep 20
            gh workflow run "24x7 Autonomous Builder" --ref main
          fi
